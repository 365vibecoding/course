<article class="max-w-3xl mx-auto py-12 px-6 text-[#1b1b32]">
    <header class="mb-10 border-b-8 border-[#0a0a23] pb-4">

    <div class="space-y-8 text-lg">
        <h2 class="text-2xl font-bold">1단계: 터미널 열기</h2>
        <p>윈도우 검색창에 <kbd class="bg-[#eeeeee] border border-[#d0d0d5] px-1 rounded">PowerShell</kbd>을 입력하고 반드시 <strong>관리자 권한으로 실행</strong>하세요.</p>
        
        <div class="bg-[#eeeeee] border-2 border-[#d0d0d5] p-2">
            <img src="https://images.unsplash.com/photo-1629654297299-c8506221ca97?auto=format&fit=crop&w=800&q=80" alt="PowerShell Admin" class="w-full h-auto rounded-sm">
        </div>

        <h2 class="text-2xl font-bold">2단계: 명령어 입력</h2>
        <div class="bg-[#0a0a23] text-white p-5 font-mono text-sm leading-relaxed">
            <p><span class="text-[#24975d]">PS C:\WINDOWS\system32></span> wsl --install</p>
        </div>
        <p>설치가 완료되면 시스템을 재부팅해야 합니다. 재부팅 후 자동으로 나타나는 Ubuntu 터미널에서 아래와 같이 사용자 계정을 생성하세요.</p>

        <div class="bg-[#feac32]/10 border-l-8 border-[#feac32] p-6 italic text-sm">
            <p><strong>Tip:</strong> Ubuntu 터미널에서 비밀번호를 입력할 때 커서가 움직이지 않는 것은 보안상 정상적인 동작입니다. 입력을 마친 후 엔터를 누르세요.</p>
        </div>
